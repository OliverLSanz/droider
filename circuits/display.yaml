name: display
title: "display – Display texts and change parameters on a DB8E"
manual_page: 199
obsolete: false
category: utility
description: |
  Sends text or numeric values to the OLED display on a DB8E controller. The display
  is updated only when the input `text` or `value` changes.

  **Text mode.** Set `text` to a string (or a number resolving to a text reference) to
  display it. Use `header` for an optional top-of-screen label.

  **Value mode.** Set `value` to a numeric CV; it will be formatted and shown. Use
  `numbermode` to fix the display format, or let the user adjust it with the DB8E buttons.

  **Linger.** Use `linger` to keep your content on screen for a set duration, preventing
  other circuits (e.g. `pot`) from overwriting the display immediately.

  **Take over controls.** Set `takeovercontrols = 1` to claim the DB8E's eight buttons
  and encoder for your own patch. The encoder push button (B1.9) is always directly
  accessible in the patch regardless of this setting.

inputs:
  - name: display
    abbr: dy
    valuetype: integer
    default: 1
    min: 1
    max: 3
    description: "Number of the DB8E display to use, starting from 1."

  - name: text
    abbr: tx
    valuetype: text
    description: Text to display in the center of the DB8E display.

  - name: header
    abbr: hr
    valuetype: text
    description: |
      Text to display at the top of the screen. Only shown when `text` or `value` is
      also used; a header cannot be displayed alone.

  - name: fontsize
    abbr: f
    valuetype: integer
    default: 0
    min: 0
    max: 3
    description: |
      Font size for text display: `0`=automatic (largest that fits), `1`=small,
      `2`=medium, `3`=large. Has no effect when `value` is used.

  - name: value
    abbr: v
    valuetype: cv
    description: |
      Numeric value to display. Cannot be used together with `text`. The format can be
      adjusted by the user with the DB8E buttons, or fixed with `numbermode`.

  - name: threshold
    abbr: th
    valuetype: cv
    description: |
      Minimum change in `value` required to trigger a display update (internal default
      0.0005). Increase if the display flickers due to analog noise; decrease if it
      misses small changes.

  - name: numbermode
    abbr: nm
    valuetype: integer
    default: 0
    min: 0
    max: 18
    description: |
      Fixes the numeric display format when using `value`. `0` = user-controlled via
      DB8E buttons. Other values: `1`=integer, `2`–`5`=decimal (1–4 places),
      `6`–`8`=voltage (1–3 places), `9`–`11`=percentage (0–2 places), `12`=note name
      (1 V/oct), `13`=gauge, `14`–`16`=fancy gauge with percentage,
      `17`=sparkline unipolar, `18`=sparkline bipolar.

  - name: linger
    abbr: l
    valuetype: cv
    default: 0.01
    unit: second
    description: |
      Time in seconds that the text or value stays on screen, preventing other circuits
      from overwriting it during that period. Useful when a `pot` or other source
      competes for the display. Default 0.01 s.

  - name: trigger
    abbr: t
    valuetype: trigger
    description: |
      When patched, a trigger here forces an immediate "popup" display update. The
      circuit no longer watches for value changes; the content is shown until another
      source updates the display.

  - name: useasdefault
    abbr: u
    valuetype: gate
    default: 0
    description: |
      Set to 1 to make this circuit the default display view: its content is shown
      whenever nothing else is being displayed (still requires `select` if that input
      is used).

  - name: screensaver
    abbr: ss
    valuetype: cv
    unit: second
    description: |
      Time in seconds before the screen saver activates to protect the OLED. Default
      is 60 s. Any user interaction (button, knob, fader, slider) snaps the display
      back to normal immediately.

  - name: takeovercontrols
    abbr: to
    valuetype: gate
    description: |
      Set to 1 to take over the DB8E's eight buttons, encoder, and their LEDs for use
      in your patch. The encoder push button (B1.9) is always accessible regardless.
      If `select` is used, `takeovercontrols` only applies when the circuit is selected.

  - name: select
    abbr: s
    valuetype: integer
    description: |
      Selection gate: the circuit processes buttons and LEDs only when `select` is a
      positive gate signal (or matches `selectat`). Non-selected circuits still process
      all other inputs and outputs normally.

  - name: selectat
    abbr: sa
    valuetype: integer
    description: |
      Makes `select` more flexible: the circuit is active when `select` equals the value
      specified here. E.g. `selectat = 0` activates the circuit when `select` is exactly 0.

examples:
  - title: Display a static text
    code: |
      ```ini
      [display]
      text = "Hello world!"
      ```
  - title: Toggle between two messages with a button
    code: |
      ```ini
      [button]
      button = B2.1
      output = _RUNNING
      inverted = _NOT_RUNNING

      [display]
      text = "Started" * _RUNNING

      [display]
      text = "Stopped" * _NOT_RUNNING
      ```
  - title: Show a numeric value with linger
    code: |
      ```ini
      [display]
      value = _TUNING
      linger = 1
      threshold = 0.001V
      ```
