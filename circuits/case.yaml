name: case
title: Switch choosing from inputs via conditions
manual_page: 168
category: utility
description: |
  Selects one of up to 16 input values and routes it to the output based on
  which of several conditions is true. For each value there is one corresponding
  `case` input. The first `case` input that is non-zero determines which `value`
  input is copied to the output. Order defines precedence.

  If all case inputs are zero, the `else` value (default 0) is output.

inputs:
  - name: case
    abbr: c
    valuetype: cv
    array: 16
    description: |
      1st through 16th condition inputs. The first one that is non-zero
      determines which corresponding `value` input is routed to the output.

  - name: value
    abbr: v
    valuetype: cv
    array: 16
    description: |
      1st through 16th value inputs. The one whose corresponding `case` input
      is the first non-zero is copied to `output`.

  - name: else
    abbr: e
    valuetype: cv
    default: 0
    description: Fallback value output when none of the `case` inputs is non-zero.

outputs:
  - name: output
    abbr: o
    valuetype: cv
    description: The selected `value` input (or `else`) is copied here.

examples:
  - title: Select clock source by priority
    code: |
      ```ini
      [case]
      case1 = _INTERNAL_CLOCK_PRESENT
      value1 = _INTERNAL_CLOCK
      case2 = _EXTERNAL_CLOCK_PRESENT
      value2 = _EXTERNAL_CLOCK
      case3 = _MIDI_CLOCK_PRESENT
      value3 = _MIDI_CLOCK
      output = _CLOCK
      ```
