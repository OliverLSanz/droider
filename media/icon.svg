<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2029"/>
      <stop offset="1" stop-color="#0B0D11"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- 4x4 LED matrix -->
  <g fill="#2A313C">
    <circle cx="68" cy="68" r="13"/><circle cx="108" cy="68" r="13"/><circle cx="148" cy="68" r="13"/><circle cx="188" cy="68" r="13"/>
    <circle cx="68" cy="108" r="13"/><circle cx="108" cy="108" r="13"/><circle cx="148" cy="108" r="13"/><circle cx="188" cy="108" r="13"/>
    <circle cx="68" cy="148" r="13"/><circle cx="108" cy="148" r="13"/><circle cx="148" cy="148" r="13"/><circle cx="188" cy="148" r="13"/>
    <circle cx="68" cy="188" r="13"/><circle cx="108" cy="188" r="13"/><circle cx="148" cy="188" r="13"/><circle cx="188" cy="188" r="13"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="68" cy="68" r="13" fill="#38BDF8"/>
    <circle cx="148" cy="108" r="13" fill="#34D399"/>
    <circle cx="108" cy="148" r="13" fill="#FBBF24"/>
    <circle cx="188" cy="188" r="13" fill="#F472B6"/>
  </g>
  <!-- patch cable from top-left LED to bottom-right LED -->
  <path d="M68 68 C 68 150, 188 100, 188 188" fill="none" stroke="url(#cable)" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="68" cy="68" r="7" fill="#0B0D11"/>
  <circle cx="188" cy="188" r="7" fill="#0B0D11"/>
</svg>
