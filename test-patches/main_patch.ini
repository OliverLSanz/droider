# LABELS: master=16
# INPUTS:
#  I1: [TRIG] Envelope trigger
#  I2: [VOCT] VCO frequency control, used for VCF key tracking

# OUTPUTS:
#  O1: [ENV] Envelope output
#  O2: [CO] VCF cutoff control
#  O3: [VOCT] A copy of the VOCT input

# CONTROLLER 2:
#  P2.1: [CO] Filter tone control
#  P2.2: [OT] Resonance
#  P2.3: [RNVEL] Amount of randomness applied to envelope velocity

# CONTROLLER 3:
#  P3.1: [SPLIT] VCO frequency
#  P3.2: [LEN] Pulse width mod

# CONTROLLER 4:
#  P4.1: [S-RND] VCF cutoff
#  P4.2: [L-RND] Resonance

[s10]
[p10]
[p2b8]
[p2b8]

# -------------------------------------------------
# Envelope 1
# -------------------------------------------------

# INPUTS
[copy]
    input = P3.1
    output = _ENV1_ATTACK_SPLIT_POT

[copy]
    input = P3.2
    output = _ENV1_LEN_POT

[copy]
    input = P4.1
    output = _ENV1_ATTACK_SPLIT_RND_POT

[copy]
    input = P4.2
    output = _ENV1_LEN_RND_POT

[copy]
    input = I1
    output = _ENV1_TRIGGER

[copy]
    input = P2.3
    output = _ENV1_VELOCITY_RANDOM_POT

# CONFIGS
[copy]
    input = 1
    output = _ENV1_VELOCITY_RANDOM_POT_ATTENUATION

# RND GENERATORS
[random]
    clock = _ENV1_TRIGGER
    maximum = _ENV1_ATTACK_SPLIT_RND_POT
    minimum = -_ENV1_ATTACK_SPLIT_RND_POT
    output = _ENV1_ATTACK_SPLIT_RND_VALUE

[random]
    clock = _ENV1_TRIGGER
    maximum = _ENV1_LEN_RND_POT
    minimum = -_ENV1_LEN_RND_POT
    output = _ENV1_LEN_RND_VALUE

# MATHS!
[math]
    input1 = _ENV1_LEN_POT + _ENV1_LEN_RND_VALUE
    input2 = 0.001
    maximum = _ENV1_LEN

[copy]
    input = _ENV1_ATTACK_SPLIT_POT + _ENV1_ATTACK_SPLIT_RND_VALUE
    output = _ENV1_ATTACK_SPLIT_UNBOUND

[math]
    input1 = _ENV1_ATTACK_SPLIT_UNBOUND
    input2 = 0
    maximum = _ENV1_ATTACK_SPLIT_LOWER_BOUNDED

[math]
    input1 = _ENV1_ATTACK_SPLIT_LOWER_BOUNDED
    input2 = 1
    minimum = _ENV1_ATTACK_SPLIT

[copy]
    input = _ENV1_LEN * _ENV1_ATTACK_SPLIT
    output = _ENV1_ATTACK_BEFORE_X20

[copy]
    input = _ENV1_ATTACK_BEFORE_X20 * 20
    output = _ENV1_ATTACK_TIME

[copy]
    input = 1 - _ENV1_ATTACK_SPLIT
    output = _ENV1_DECAY_SPLIT

[copy]
    input = _ENV1_LEN * _ENV1_DECAY_SPLIT
    output = _ENV1_RELEASE_TIME

# ENVELOPE
[contour]
    trigger = _ENV1_TRIGGER
    attack = _ENV1_ATTACK_TIME
    release = _ENV1_RELEASE_TIME
    output = _ENV1_VALUE

# VELOCITY

# _ENV1_VELOCITY_RANDOM_MIN = 1 - (_ENV1_VELOCITY_RANDOM_POT * _ENV1_VELOCITY_RANDOM_POT_ATTENUATION) 
[copy]
    input = _ENV1_VELOCITY_RANDOM_POT * _ENV1_VELOCITY_RANDOM_POT_ATTENUATION
    output = _ENV1_VELOCITY_RANDOM_POT_ATTENUATED
[copy]
    input = 1 - _ENV1_VELOCITY_RANDOM_POT_ATTENUATED
    output = _ENV1_VELOCITY_RANDOM_MIN

[random]
    clock = _ENV1_TRIGGER
    maximum = 1
    minimum = _ENV1_VELOCITY_RANDOM_MIN
    output = _ENV1_VELOCITY

[copy]
    input = _ENV1_VALUE * _ENV1_VELOCITY
    output = O1

# -------------------------------------------------
# VCF control
# -------------------------------------------------

# INPUTS
[copy]
    input = I2
    output = _VOCT

[copy]
    input = P2.1
    output = _FILTER_CUTOFF_POT

[copy]
    input = P2.2
    output = _KEY_TRACKING_AMOUNT_POT

# MATHS!
[copy]
    input = _VOCT * _KEY_TRACKING_AMOUNT_POT
    output = _KEY_TRACKING_VALUE

[copy]
    input = _FILTER_CUTOFF_POT + _KEY_TRACKING_VALUE
    output = _CUTOFF

# OUTPUT
[copy]
    input = _CUTOFF
    output = O2

[copy]
    input = _VOCT
    output = O3

